<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="10">
<title>Probe 4: meta refresh</title>
<script src="reporter.js"></script>
<style>
body { margin: 0; padding: 24px; font-family: Helvetica, Arial, sans-serif; font-size: 26px; }
h1 { font-size: 30px; }
.big { font-size: 60px; font-weight: bold; }
</style>
</head>
<body>
<h1>Probe 4: meta refresh (10 s)</h1>
<p>This page reloads itself every 10 seconds. Leave it open 10+ minutes
with the screen on. Reloads should keep counting. If it stops, the refresh died.</p>
<div class="big" id="count">?</div>
<p id="t"></p>
<p id="first"></p>
<script>
(function () {
  var n = 0, first = '';
  try {
    n = parseInt(sessionStorage.getItem('p4n') || '0', 10) + 1;
    sessionStorage.setItem('p4n', String(n));
    first = sessionStorage.getItem('p4first');
    if (!first) { first = new Date().toString(); sessionStorage.setItem('p4first', first); }
  } catch (e) { first = 'sessionStorage failed: ' + e.message; }
  document.getElementById('count').innerHTML = 'Reload #' + n;
  document.getElementById('t').innerHTML = 'Now: ' + new Date().toString();
  document.getElementById('first').innerHTML = 'Started: ' + first;
})();
</script>
</body>
</html>
